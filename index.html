<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ICT Service Request System</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div id="app">

        <header>
            <h1>ICT SERVICE REQUEST SYSTEM</h1>

            <div>
                <span id="userEmail"></span>
                <button onclick="logout()">Logout</button>
            </div>
        </header>


        <!-- DASHBOARD -->

        <section class="dashboard">

            <div class="card">
                <h3>Total Requests</h3>
                <p id="totalRequests">0</p>
            </div>

            <div class="card">
                <h3>Pending</h3>
                <p id="pendingRequests">0</p>
            </div>

            <div class="card">
                <h3>In Progress</h3>
                <p id="inProgressRequests">0</p>
            </div>

            <div class="card">
                <h3>Completed</h3>
                <p id="completedRequests">0</p>
            </div>

        </section>


        <!-- NEW REQUEST -->

        <section class="request-form">

            <h2>New Service Request</h2>

            <form id="requestForm">

                <label for="requesterName">
                    Requester Name
                </label>

                <input
                    type="text"
                    id="requesterName"
                    required
                >


                <label for="department">
                    Department
                </label>

                <input
                    type="text"
                    id="department"
                    required
                >


                <label for="category">
                    Category
                </label>

                <select id="category" required>

                    <option value="">
                        Select Category
                    </option>

                    <option value="Computer Repair">
                        Computer Repair
                    </option>

                    <option value="Software Installation">
                        Software Installation
                    </option>

                    <option value="Network Problem">
                        Internet/Network Problem
                    </option>

                    <option value="Printer Problem">
                        Printer Problem
                    </option>

                    <option value="Account/Access Concern">
                        Account/Access Concern
                    </option>

                    <option value="Other">
                        Other ICT Concern
                    </option>

                </select>


                <label for="description">
                    Description
                </label>

                <textarea
                    id="description"
                    rows="4"
                    required
                ></textarea>


                <label for="priority">
                    Priority
                </label>

                <select id="priority" required>

                    <option value="">
                        Select Priority
                    </option>

                    <option value="Low">
                        Low
                    </option>

                    <option value="Medium">
                        Medium
                    </option>

                    <option value="High">
                        High
                    </option>

                </select>


                <button type="submit">
                    Submit Request
                </button>

                <p id="requestMessage"></p>

            </form>

        </section>


        <!-- REQUEST TABLE -->

        <section>

            <h2>Service Requests</h2>

            <input
                type="text"
                id="searchInput"
                placeholder="Search requester or description..."
            >

            <div class="filters">

                <select id="statusFilter">

                    <option value="All">
                        All Status
                    </option>

                    <option value="Pending">
                        Pending
                    </option>

                    <option value="In Progress">
                        In Progress
                    </option>

                    <option value="Completed">
                        Completed
                    </option>

                </select>


                <select id="priorityFilter">

                    <option value="All">
                        All Priority
                    </option>

                    <option value="Low">
                        Low
                    </option>

                    <option value="Medium">
                        Medium
                    </option>

                    <option value="High">
                        High
                    </option>

                </select>

            </div>


            <div class="table-container">

                <table>

                    <thead>

                        <tr>
                            <th>ID</th>
                            <th>Requester</th>
                            <th>Department</th>
                            <th>Category</th>
                            <th>Priority</th>
                            <th>Status</th>
                            <th>Date</th>
                            <th>Action</th>
                        </tr>

                    </thead>

                    <tbody id="requestTableBody">

                    </tbody>

                </table>

            </div>

        </section>

    </div>


    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/supabase.js"></script>

    <script src="js/auth.js"></script>

    <script src="js/app.js"></script>

</body>
</html>
